[project]
name = "chokepoint-lens"
version = "0.1.0"
description = "Interactive dashboard of Suez Canal and global maritime chokepoint traffic, built on IMF PortWatch data"
readme = "README.md"
authors = [
    { name = "Mohamed Gamal", email = "1Mohamed.Gamal54@gmail.com" }
]
requires-python = ">=3.12"

dependencies = [
    # --- data handling ---
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",       # lets pandas read/write .parquet files
    "requests>=2.31",      # talks to the PortWatch API

    # --- visualisation (all listed on PyViz.org) ---
    "holoviews>=1.18",     # the core library: charts + linked selections
    "hvplot>=0.9",         # shorthand for charts straight off a dataframe
    "geoviews>=1.11",      # the world map with chokepoints on it
    "panel>=1.4",          # dashboard layout, widgets, and the web server
    "bokeh>=3.4",          # the engine holoviews draws through
]

[tool.uv]
# This is an application we run, not a library we publish, so uv should
# manage the environment without trying to build an installable package.
package = false
