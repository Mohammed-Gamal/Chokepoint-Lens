[project]
name = "chokepoint-lens"
version = "0.1.0"
description = "Interactive dashboard of Suez Canal and global maritime chokepoint traffic, built on IMF PortWatch data"
readme = "README.md"
authors = [
    { name = "Mohamed Gamal", email = "1Mohamed.Gamal54@gmail.com" }
]
requires-python = ">=3.12"

# Every package here is either imported by src/, or required at runtime by
# something that is. Nothing is listed "just in case" -- see README.md for
# which module uses what.
dependencies = [
    # --- imported directly ---
    "pandas>=2.2",         # every table in the project
    "requests>=2.31",      # talks to the PortWatch API (fetch.py)
    "holoviews>=1.18",     # every chart object (PyViz)
    "geoviews>=1.11",      # the world map and its basemap (PyViz)
    "cartopy>=0.22",       # the coordinate system the map points use
    "panel>=1.4",          # dashboard layout, widgets, web server (PyViz)

    # --- required at runtime, not imported by us ---
    "pyarrow>=15.0",       # pandas uses it to read and write .parquet
    "bokeh>=3.4",          # the renderer holoviews draws through
]

[tool.uv]
# This is an application we run, not a library we publish, so uv should
# manage the environment without trying to build an installable package.
package = false
